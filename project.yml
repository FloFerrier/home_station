# =========================================================================
#   HomeStation - Configuration Complète
#   Merge de project.yml + test/ceedling.yml
# =========================================================================

---
:project:
  :which_ceedling: gem
  :ceedling_version: 1.0.0
  :use_mocks: TRUE
  :use_test_preprocessor: :none
  :use_deep_preprocessor: :none
  :use_backtrace: :simple
  :use_decorators: :auto
  :build_root: build/test
  :test_file_prefix: test_
  :default_tasks:
    - test:all
    - gcov:all
  :test_threads: 8
  :compile_threads: 8
  :release_build: FALSE

:mixins:
  :enabled: []
  :load_paths: []

:test_build:
  :use_assembly: FALSE

:release_build:
  :output: HomeStation.elf
  :use_assembly: FALSE
  :artifacts: []

:plugins:
  :load_paths: []
  :enabled:
    - module_generator
    - report_tests_gtestlike_stdout
    - gcov
    - report_tests_log_factory

:report_tests_log_factory:
  :use_test_name: true
  :format: html

:extension:
  :executable: .out

:paths:
  :test:
    - +:test/**
    - -:test/support
  :source:
    - src/**
    - test/support/**
  :include:
    - test/support/**
    - src/**
  :support:
    - test/support
  :libraries: []

:files:
  :test: []
  :source: []

:defines:
  :test:
    - TEST
    - STM32F446xx
    - USE_HAL_DRIVER
  :release: []

:cmock:
  :plugins:
    - :ignore
    - :callback
  :verbosity: 2
  :when_no_prototypes: :warn
  :mock_prefix: mock_
  :strippables:
    - '(?:__attribute__\s*\([ (]*.*?[ )]*\)+)'
  :attributes:
    - __ramfunc
    - __irq
    - __fiq
    - register
    - extern
  :c_calling_conventions:
    - __stdcall
    - __cdecl
    - __fastcall
  :treat_externs: :exclude
  :treat_inlines: :exclude
  :treat_as:
    uint8: HEX8
    uint16: HEX16
    uint32: UINT32
    int8: INT8
    bool: UINT8
  :memcmp_if_unknown: true
  :when_ptr: :compare_data
  :weak: ''
  :enforce_strict_ordering: true
  :fail_on_unexpected_calls: true
  :callback_include_count: true
  :callback_after_arg_check: false
  :exclude_setjmp_h: false

:unity:
  :defines:
    - UNITY_EXCLUDE_FLOAT

:gcov:
  :html_report_file: coverage/index.html
  :xml_report_file: coverage/coverage.xml
  :reports:
    - HtmlDetailed
    - Text
    - Xml
    - Cobertura

:libraries:
  :placement: :end
  :flag: "-l${1}"
  :path_flag: "-L ${1}"
  :system: []
  :test: []
  :release: []
