name: Unit Test
run-name: Home Station pipelines for building and running unit tests
on:
  push:
    branches:
      - main
jobs:
  build_and_run_unit_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -yq build-essential gcc git lcov make python3-venv ruby
      - name: Install Ceedling
        run: |
          gem install ceedling
      - name: Install gcovr in venv
        run: |
          python3 -m venv venv
          ./venv/bin/pip install gcovr
      - name: Get third-party dependencies
        run: |
          git submodule update --init --recursive
      - name: Build and run test suite
        run: |
          make test_suite
      - name: Launch code coverage
        run: |
          make coverage
      - name: Archive code coverage report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: ${{ github.workspace }}/build/test/code_coverage.html
